name: Nomi
options:
  bundleIdPrefix: com.nomi
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "16.0"
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    GENERATE_INFOPLIST_FILE: YES
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "1.0"
    INFOPLIST_KEY_CFBundleDisplayName: "Nomi"
    INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.education"
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"

targets:
  Nomi:
    type: application
    platform: iOS
    sources:
      - path: Nomi
        excludes:
          - "**/*.plist"
          - "Preview Content/**"
      - path: Nomi/Preview Content
        buildPhase: resources
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nomi.app
        INFOPLIST_FILE: Nomi/Info.plist
        CODE_SIGN_ENTITLEMENTS: Nomi/Nomi.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
    entitlements:
      path: Nomi/Nomi.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
