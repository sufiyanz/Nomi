name: Nomi
options:
  bundleIdPrefix: com.sufiyanz
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Nomi:
    type: application
    platform: iOS
    sources:
      - path: Nomi
        excludes:
          - "Secrets.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sufiyanz.nomi
        INFOPLIST_FILE: Nomi/Info.plist
        CODE_SIGN_ENTITLEMENTS: Nomi/Nomi.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: ""
    entitlements:
      path: Nomi/Nomi.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
